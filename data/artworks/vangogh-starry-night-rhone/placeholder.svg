<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1261" viewBox="0 0 1600 1261">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12294d"/>
      <stop offset="0.5" stop-color="#1b3a66"/>
      <stop offset="1" stop-color="#27507f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a66"/>
      <stop offset="0.6" stop-color="#152e52"/>
      <stop offset="1" stop-color="#22406b"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdf6c8"/>
      <stop offset="0.35" stop-color="#e9e3a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e9e3a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a56"/>
      <stop offset="1" stop-color="#57496b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="620" fill="url(#sky)"/>
  <rect y="620" width="1600" height="460" fill="url(#water)"/>
  <rect y="1080" width="1600" height="181" fill="url(#shore)"/>

  <!-- Great Bear -->
  <g>
    <circle cx="360" cy="120" r="52" fill="url(#star)"/><circle cx="360" cy="120" r="9" fill="#fdf7d4"/>
    <circle cx="500" cy="90" r="46" fill="url(#star)"/><circle cx="500" cy="90" r="8" fill="#f4ecc0"/>
    <circle cx="640" cy="110" r="50" fill="url(#star)"/><circle cx="640" cy="110" r="8" fill="#eef0c8"/>
    <circle cx="770" cy="160" r="44" fill="url(#star)"/><circle cx="770" cy="160" r="7" fill="#f3ddc0"/>
    <circle cx="880" cy="80" r="46" fill="url(#star)"/><circle cx="880" cy="80" r="8" fill="#e9f0d0"/>
    <circle cx="1010" cy="130" r="50" fill="url(#star)"/><circle cx="1010" cy="130" r="8" fill="#f9edc8"/>
    <circle cx="1130" cy="200" r="42" fill="url(#star)"/><circle cx="1130" cy="200" r="7" fill="#f0e6be"/>
    <circle cx="220" cy="260" r="36" fill="url(#star)"/><circle cx="220" cy="260" r="6" fill="#e6ddb4"/>
    <circle cx="1330" cy="110" r="38" fill="url(#star)"/><circle cx="1330" cy="110" r="6" fill="#f4e8c2"/>
    <circle cx="1460" cy="250" r="34" fill="url(#star)"/><circle cx="1460" cy="250" r="6" fill="#ecdfb6"/>
    <circle cx="120" cy="90" r="34" fill="url(#star)"/><circle cx="120" cy="90" r="6" fill="#f0e8c0"/>
  </g>

  <!-- far bank: town lights -->
  <rect y="590" width="1600" height="34" fill="#0e2038"/>
  <g fill="#f5c542">
    <circle cx="120" cy="600" r="8"/><circle cx="260" cy="598" r="9"/><circle cx="390" cy="602" r="8"/>
    <circle cx="510" cy="599" r="9"/><circle cx="640" cy="601" r="8"/><circle cx="760" cy="598" r="10"/>
    <circle cx="900" cy="600" r="8"/><circle cx="1030" cy="602" r="9"/><circle cx="1150" cy="598" r="8"/>
    <circle cx="1290" cy="601" r="9"/><circle cx="1430" cy="599" r="8"/><circle cx="1540" cy="602" r="7"/>
  </g>

  <!-- reflections: ragged golden columns -->
  <g fill="#d9a43a" opacity="0.9">
    <path d="M112,620 l14,0 l-4,60 l10,60 l-8,80 l6,70 l-14,0 l4,-70 l-8,-80 l8,-60 Z"/>
    <path d="M252,620 l16,0 l-6,70 l12,70 l-10,90 l8,80 l-16,0 l6,-80 l-10,-90 l10,-70 Z"/>
    <path d="M502,620 l16,0 l-4,66 l10,64 l-8,84 l6,76 l-16,0 l6,-76 l-10,-84 l8,-64 Z"/>
    <path d="M752,620 l18,0 l-6,72 l14,72 l-12,96 l10,86 l-18,0 l8,-86 l-12,-96 l12,-72 Z"/>
    <path d="M1022,620 l16,0 l-4,64 l10,66 l-8,82 l6,72 l-16,0 l6,-72 l-10,-82 l8,-66 Z"/>
    <path d="M1282,620 l16,0 l-6,68 l12,66 l-10,88 l8,78 l-16,0 l6,-78 l-10,-88 l10,-66 Z"/>
    <path d="M1422,620 l14,0 l-4,58 l8,58 l-6,76 l4,64 l-14,0 l6,-64 l-8,-76 l8,-58 Z"/>
    <path d="M382,620 l12,0 l-4,52 l8,54 l-6,68 l4,58 l-12,0 l4,-58 l-6,-68 l6,-54 Z"/>
    <path d="M892,620 l12,0 l-4,50 l8,52 l-6,64 l4,56 l-12,0 l4,-56 l-6,-64 l6,-52 Z"/>
  </g>

  <!-- water strokes -->
  <g stroke="#3f6ea0" stroke-width="6" opacity="0.5" fill="none">
    <path d="M0,700 H1600"/><path d="M0,780 H1600"/><path d="M0,860 H1600"/>
    <path d="M0,940 H1600"/><path d="M0,1020 H1600"/>
  </g>

  <!-- moored boat -->
  <path d="M1180,1058 q90,26 190,8 l-8,22 q-92,16 -176,-6 Z" fill="#0c1626"/>
  <line x1="1290" y1="980" x2="1286" y2="1064" stroke="#0c1626" stroke-width="6"/>

  <!-- the lovers -->
  <g fill="#1d2434">
    <path d="M320,1095 q10,-38 24,-40 q16,2 22,40 l6,86 l-56,0 Z"/>
    <circle cx="344" cy="1042" r="15"/>
    <path d="M376,1098 q8,-34 22,-36 q14,2 20,36 l6,84 l-52,0 Z"/>
    <circle cx="398" cy="1050" r="14"/>
  </g>
  <ellipse cx="360" cy="1195" rx="120" ry="16" fill="#2b2740" opacity="0.8"/>
</svg>
